name: Linux Ubuntu RDP

on:
  workflow_dispatch:
    inputs:
      proxy_mode:
        description: "代理模式（off=仅RDP / exit-node=出口代理）"
        required: false
        default: "off"
        type: choice
        options:
          - off
          - exit-node

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: 1. Install Desktop Environment & XRDP
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 xfce4-goodies \
            xrdp dbus-x11 \
            firefox \
            gnome-terminal \
            thunar \
            htop nload \
            vim nano \
            software-properties-common

          # 配置 XRDP 使用 XFCE
          echo "startxfce4" | sudo tee /etc/xrdp/startwm.sh
          sudo chmod +x /etc/xrdp/startwm.sh

          # 创建 RDP 用户
          sudo useradd -m -s /bin/bash ubuntu
          echo "ubuntu:P@ssw0rd1qazXSW@#" | sudo chpasswd
          sudo usermod -aG sudo ubuntu
          echo "ubuntu ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/ubuntu

          # 启动 XRDP
          sudo service dbus start
          sudo xrdp --nodaemon &
          sleep 3

          echo "✅ XFCE 桌面 + XRDP 已就绪"

      - name: 2. Install Tailscale & Connect
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sudo sh

          # 开启 IP 转发（代理模式）
          if [ "${{ github.event.inputs.proxy_mode }}" = "exit-node" ]; then
            echo 'net.ipv4.ip_forward = 1' | sudo tee -a /etc/sysctl.conf
            sudo sysctl -p
          fi

          # 启动 Tailscale
          sudo tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock &
          sleep 3

          TS_ARGS="up --authkey=$TAILSCALE_AUTHKEY --hostname=github-ubuntu-rdp"
          if [ "${{ github.event.inputs.proxy_mode }}" = "exit-node" ]; then
            TS_ARGS="$TS_ARGS --advertise-exit-node --accept-routes"
          fi

          sudo tailscale $TS_ARGS 2>&1
          sleep 5

          TS_IP=$(sudo tailscale ip -4)

          echo ""
          echo "=========================================="
          echo "  >>> LINUX UBUNTU RDP IS READY! <<<"
          echo "  Tailscale IP : $TS_IP"
          echo "  Username     : ubuntu"
          echo "  Password     : P@ssw0rd1qazXSW@#"
          echo "  Desktop      : XFCE"
          echo "  Proxy Mode   : ${{ github.event.inputs.proxy_mode }}"
          if [ "${{ github.event.inputs.proxy_mode }}" = "exit-node" ]; then
            echo "  >> Approve: https://login.tailscale.com/admin/machines"
            echo "  >> Use:     tailscale set --exit-node=github-ubuntu-rdp"
          fi
          echo "  >> Open mstsc and connect to: $TS_IP:3389"
          echo "=========================================="

      - name: 3. Install Common Tools
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            qbittorrent \
            vlc \
            gimp \
            obs-studio \
            ffmpeg \
            git \
            python3 python3-pip \
            nodejs npm \
            openssh-server \
            curl wget \
            p7zip-full \
            file-roller \
            chromium-browser

          echo "✅ 常用软件安装完成"

      - name: 4. Keep Server Alive (5.5 Hours)
        run: |
          END_TIME=$(date -d "+330 minutes" +%s)
          echo "⏰ 保活 5.5 小时，结束时间: $(date -d '+330 minutes' '+%Y-%m-%d %H:%M:%S UTC')"

          I=0
          while [ $(date +%s) -lt $END_TIME ]; do
            sleep 60
            I=$((I + 1))
            REMAINING=$(( (END_TIME - $(date +%s)) / 60 ))
            echo "[$I] Server running... 剩余约 $REMAINING 分钟"
          done

          echo "⏰ 保活结束，runner 即将退出。"
          echo "=========================================="
          echo "  ⚠️ RDP 会话即将断开 — 请保存工作！"
          echo "=========================================="