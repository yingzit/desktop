name: Windows Cloud RDP

on:
  workflow_dispatch:
    inputs:
      keep_alive_hours:
        description: "保活时长（小时，最大 5.5）"
        required: false
        default: "5"
      vpn_mode:
        description: "VPN 方式（tailscale 或 ngrok）"
        required: false
        default: "tailscale"
        type: choice
        options:
          - tailscale
          - ngrok
      proxy_mode:
        description: "代理模式（off=仅RDP / exit-node=出口代理 / routes=全流量代理）"
        required: false
        default: "off"
        type: choice
        options:
          - off
          - exit-node
          - routes

env:
  RDP_USER: NvdAdmin
  INSTALL_DIR: D:\Program Files
  TEMP_DIR: D:\Temp
  DESKTOP_DIR: D:\Desktop

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 330

    steps:
      - name: 0. Generate Random Password & Setup D Drive
        run: |
          # 创建 D 盘全部目录
          $dirs = @("D:\Program Files","D:\Temp","D:\Tools","D:\Desktop","D:\Users","D:\Users\Public","D:\Downloads","D:\Documents")
          foreach ($d in $dirs) {
            New-Item -ItemType Directory -Force -Path $d | Out-Null
          }

          # 重定向桌面到 D:\Desktop（注册表）
          $desktopReg = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders"
          Set-ItemProperty -Path $desktopReg -Name "Desktop" -Value "D:\Desktop" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $desktopReg -Name "Personal" -Value "D:\Documents" -ErrorAction SilentlyContinue
          Set-ItemProperty -Path $desktopReg -Name "{374DE290-123F-4565-9164-9C5D6E4F7C17}" -Value "D:\Downloads" -ErrorAction SilentlyContinue

          # 重定向系统 TEMP/TMP 到 D 盘
          [Environment]::SetEnvironmentVariable("TEMP", "D:\Temp", "Machine")
          [Environment]::SetEnvironmentVariable("TMP", "D:\Temp", "Machine")
          [Environment]::SetEnvironmentVariable("TEMP", "D:\Temp", "User")
          [Environment]::SetEnvironmentVariable("TMP", "D:\Temp", "User")

          # 生成 16 位随机密码
          $chars = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#\$%^&*"
          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $password = New-Object char[] 16
          $bytes = New-Object byte[] 1
          for ($i = 0; $i -lt 16; $i++) {
            $rng.GetBytes($bytes)
            $password[$i] = $chars[$bytes[0] % $chars.Length]
          }
          $rdpPassword = -join $password

          echo "RDP_PASSWORD=$rdpPassword" >> $env:GITHUB_ENV
          echo "::add-mask::$rdpPassword"

          # 校验 VPN Secrets
          $vpnMode = "${{ github.event.inputs.vpn_mode }}"
          if ($vpnMode -eq "tailscale" -and [string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            Write-Host "::error::TAILSCALE_AUTHKEY secret 未配置！"
            exit 1
          }
          if ($vpnMode -eq "ngrok" -and [string]::IsNullOrWhiteSpace($env:NGROK_AUTH_TOKEN)) {
            Write-Host "::error::NGROK_AUTH_TOKEN secret 未配置！"
            exit 1
          }
          Write-Host "✅ D 盘目录已创建 | 桌面→D:\Desktop | TEMP→D:\Temp | VPN: $vpnMode"
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0
          Write-Host "✅ 远程桌面已开启"

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          New-LocalUser -Name $env:RDP_USER -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER -ErrorAction SilentlyContinue
          net user runneradmin $env:RDP_PASSWORD
          Write-Host "✅ 管理员账户 $env:RDP_USER 已创建"
        env:
          RDP_USER: ${{ env.RDP_USER }}
          RDP_PASSWORD: ${{ env.RDP_PASSWORD }}

      - name: 3. Connect VPN (Tailscale or Ngrok)
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $vpnMode = "${{ github.event.inputs.vpn_mode }}"
          $ts_ip = ""

          if ($vpnMode -eq "tailscale") {
            $proxyMode = "${{ github.event.inputs.proxy_mode }}"
            Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "D:\Temp\tailscale.msi"
            Start-Process msiexec -ArgumentList "/i D:\Temp\tailscale.msi /quiet /norestart INSTALLDIR=D:\Program Files\Tailscale" -Wait
            Start-Sleep -Seconds 5
            $tsExe = "D:\Program Files\Tailscale\tailscale.exe"

            # 开启 Windows IP 转发（代理模式需要）
            if ($proxyMode -ne "off") {
              Write-Host "🌐 开启 IP 转发..."
              Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters" -Name "IPEnableRouter" -Value 1
              netsh interface ipv4 set interface "Ethernet" forwarding=enabled 2>$null
              Set-Service -Name "RemoteAccess" -StartupType Automatic 2>$null
              Start-Service -Name "RemoteAccess" 2>$null
            }

            # 根据 proxy_mode 组装参数
            $tsArgs = @("up", "--authkey=$Env:TAILSCALE_AUTHKEY", "--hostname=github-rdp")
            if ($proxyMode -eq "exit-node") {
              $tsArgs += "--advertise-exit-node"
              $tsArgs += "--accept-routes"
              Write-Host "🔗 出口代理模式（exit-node）..."
            } elseif ($proxyMode -eq "routes") {
              $tsArgs += "--advertise-routes=0.0.0.0/0"
              $tsArgs += "--accept-routes"
              Write-Host "🔗 全流量代理模式（routes）..."
            } else {
              Write-Host "🔗 仅 RDP 模式..."
            }

            & $tsExe @tsArgs 2>&1
            Start-Sleep -Seconds 10
            $ts_ip = & $tsExe ip -4
            if ([string]::IsNullOrWhiteSpace($ts_ip)) { Write-Host "::error::Tailscale IP 获取失败"; exit 1 }
            $ts_ip = $ts_ip.Trim()

            if ($proxyMode -ne "off") {
              Write-Host "⚠️ 请到 Tailscale 面板 approve 此节点: https://login.tailscale.com/admin/machines"
            }

          } elseif ($vpnMode -eq "ngrok") {
            Invoke-WebRequest "https://bin.equinox.io/c/bNrdb6J64Gw/ngrok-v3-stable-windows-amd64.zip" -OutFile "D:\Temp\ngrok.zip"
            Expand-Archive "D:\Temp\ngrok.zip" -DestinationPath "D:\Tools\ngrok" -Force
            & "D:\Tools\ngrok\ngrok.exe" config add-authtoken $env:NGROK_AUTH_TOKEN 2>&1
            Start-Process "D:\Tools\ngrok\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout" -WindowStyle Hidden
            Start-Sleep -Seconds 8
            $retry = 0
            while ($retry -lt 10) {
              try {
                $resp = Invoke-WebRequest "http://127.0.0.1:4040/api/tunnels" -UseBasicParsing -TimeoutSec 5
                $tunnels = $resp.Content | ConvertFrom-Json
                $ts_ip = $tunnels.tunnels[0].public_url -replace "tcp://",""
                if ($ts_ip) { break }
              } catch {}
              Start-Sleep -Seconds 2
              $retry++
            }
            if ([string]::IsNullOrWhiteSpace($ts_ip)) { Write-Host "::error::ngrok 隧道获取失败"; exit 1 }
          }

          $hours = [double]"${{ github.event.inputs.keep_alive_hours }}"
          $endTime = (Get-Date).AddHours($hours)

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  VPN Mode     : $vpnMode" -ForegroundColor Yellow
          Write-Host "  Proxy Mode   : ${{ github.event.inputs.proxy_mode }}" -ForegroundColor Yellow
          Write-Host "  Address      : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : $env:RDP_USER" -ForegroundColor Yellow
          Write-Host "  Password     : $env:RDP_PASSWORD" -ForegroundColor Yellow
          Write-Host "  Install Dir  : D:\Program Files" -ForegroundColor Yellow
          Write-Host "  Desktop      : D:\Desktop" -ForegroundColor Yellow
          Write-Host "  Temp         : D:\Temp" -ForegroundColor Yellow
          Write-Host "  End Time     : $endTime (UTC)" -ForegroundColor Yellow
          if ($vpnMode -eq "tailscale" -and "${{ github.event.inputs.proxy_mode }}" -ne "off") {
            Write-Host "  Proxy Usage  : tailscale set --exit-node=github-rdp" -ForegroundColor Magenta
            Write-Host "  Admin Panel  : https://login.tailscale.com/admin/machines" -ForegroundColor Magenta
            Write-Host "  >> 1. Approve exit-node in admin panel" -ForegroundColor Magenta
            Write-Host "  >> 2. On your device: tailscale set --exit-node=github-rdp" -ForegroundColor Magenta
          }
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host "==========================================" -ForegroundColor Green

      - name: 4. Install Software - Browsers & Tools (D Drive)
        run: |
          $ProgressPreference = 'SilentlyContinue'

          Write-Host "🌐 Chrome → D:\Program Files\Google\Chrome"
          Invoke-WebRequest "https://dl.google.com/chrome/install/latest/chrome_installer.exe" -OutFile "D:\Temp\chrome.exe"
          Start-Process "D:\Temp\chrome.exe" -ArgumentList "/silent /install /D=D:\Program Files\Google\Chrome" -Wait -ErrorAction SilentlyContinue

          Write-Host "🦊 Firefox → D:\Program Files\Mozilla Firefox"
          Invoke-WebRequest "https://download.mozilla.org/?product=firefox-latest-ssl&os=win64&lang=zh-CN" -OutFile "D:\Temp\firefox.exe"
          Start-Process "D:\Temp\firefox.exe" -ArgumentList "/S /D=D:\Program Files\Mozilla Firefox" -Wait -ErrorAction SilentlyContinue

          Write-Host "📦 7-Zip → D:\Program Files\7-Zip"
          Invoke-WebRequest "https://www.7-zip.org/a/7z2409-x64.exe" -OutFile "D:\Temp\7z.exe"
          Start-Process "D:\Temp\7z.exe" -ArgumentList "/S /D=D:\Program Files\7-Zip" -Wait -ErrorAction SilentlyContinue

          Write-Host "📝 Notepad++ → D:\Program Files\Notepad++"
          Invoke-WebRequest "https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v8.6.9/npp.8.6.9.Installer.x64.exe" -OutFile "D:\Temp\npp.exe"
          Start-Process "D:\Temp\npp.exe" -ArgumentList "/S /D=D:\Program Files\Notepad++" -Wait -ErrorAction SilentlyContinue

          Write-Host "🔍 Everything → D:\Program Files\Everything"
          Invoke-WebRequest "https://www.voidtools.com/Everything-1.4.1.1024.x64-Setup.exe" -OutFile "D:\Temp\everything.exe"
          Start-Process "D:\Temp\everything.exe" -ArgumentList "/S /D=D:\Program Files\Everything" -Wait -ErrorAction SilentlyContinue

          Write-Host "✅ 浏览器 & 工具安装完成"

      - name: 5. Install Software - Dev & CLI (D Drive)
        run: |
          $ProgressPreference = 'SilentlyContinue'

          Write-Host "⚡ winget → D:\Program Files"
          $apps = @("Git.Git","Microsoft.VisualStudioCode","Python.Python.3.12","OpenJS.NodeJS.LTS","Microsoft.PowerToys","Rufus.Rufus")
          foreach ($app in $apps) {
            Write-Host "  → $app"
            winget install $app --silent --accept-package-agreements --accept-source-agreements --disable-interactivity --location "D:\Program Files" 2>&1 | Out-Null
          }

          Write-Host "💎 PowerShell 7 → D:\Program Files\PowerShell\7"
          Invoke-WebRequest "https://github.com/PowerShell/PowerShell/releases/latest/download/PowerShell-7.4.6-win-x64.msi" -OutFile "D:\Temp\pwsh7.msi"
          Start-Process msiexec -ArgumentList "/i D:\Temp\pwsh7.msi /quiet /norestart INSTALLDIR=D:\Program Files\PowerShell\7" -Wait -ErrorAction SilentlyContinue

          Write-Host "✅ 开发工具安装完成"

      - name: 6. Install Software - Media & Social (D Drive)
        run: |
          $ProgressPreference = 'SilentlyContinue'

          Write-Host "🎬 VLC → D:\Program Files\VLC"
          Invoke-WebRequest "https://get.videolan.org/vlc/3.0.21/win64/vlc-3.0.21-win64.exe" -OutFile "D:\Temp\vlc.exe"
          Start-Process "D:\Temp\vlc.exe" -ArgumentList "/S /D=D:\Program Files\VLC" -Wait -ErrorAction SilentlyContinue

          Write-Host "📥 qBittorrent → D:\Program Files\qBittorrent"
          Invoke-WebRequest "https://sourceforge.net/projects/qbittorrent/files/qbittorrent-win32/qbittorrent-5.0.2/qbittorrent_5.0.2_x64_setup.exe/download" -OutFile "D:\Temp\qbittorrent.exe"
          Start-Process "D:\Temp\qbittorrent.exe" -ArgumentList "/S /D=D:\Program Files\qBittorrent" -Wait -ErrorAction SilentlyContinue

          Write-Host "✈️ Telegram → D:\Program Files\Telegram Desktop"
          Invoke-WebRequest "https://telegram.org/dl/desktop/win64" -OutFile "D:\Temp\telegram.exe"
          New-Item -ItemType Directory -Force -Path "D:\Program Files\Telegram Desktop" | Out-Null
          Start-Process "D:\Temp\telegram.exe" -ArgumentList "/S /D=D:\Program Files\Telegram Desktop" -Wait -ErrorAction SilentlyContinue

          Write-Host "🎥 PotPlayer → D:\Program Files\PotPlayer"
          Invoke-WebRequest "https://potplayer.tv/download/PotPlayerSetup64.exe" -OutFile "D:\Temp\potplayer.exe"
          Start-Process "D:\Temp\potplayer.exe" -ArgumentList "/S /D=D:\Program Files\PotPlayer" -Wait -ErrorAction SilentlyContinue

          Write-Host "✅ 媒体 & 社交软件安装完成"

      - name: 7. Install Software - Download & Remote (D Drive)
        run: |
          $ProgressPreference = 'SilentlyContinue'

          Write-Host "⬇️ IDM → D:\Program Files\IDM"
          Invoke-WebRequest "https://download3.internetdownloadmanager.com/idman642build28.exe" -OutFile "D:\Temp\idm.exe"
          Start-Process "D:\Temp\idm.exe" -ArgumentList "/silent /norestart /D=D:\Program Files\IDM" -Wait -ErrorAction SilentlyContinue

          Write-Host "📁 WinSCP → D:\Program Files\WinSCP"
          Invoke-WebRequest "https://winscp.net/download/WinSCP-6.3.6-Setup.exe" -OutFile "D:\Temp\winscp.exe"
          Start-Process "D:\Temp\winscp.exe" -ArgumentList "/SILENT /DIR=D:\Program Files\WinSCP" -Wait -ErrorAction SilentlyContinue

          Write-Host "🖥️ AnyDesk → D:\Program Files\AnyDesk"
          Invoke-WebRequest "https://download.anydesk.com/AnyDesk.exe" -OutFile "D:\Temp\anydesk.exe"
          New-Item -ItemType Directory -Force -Path "D:\Program Files\AnyDesk" | Out-Null
          Copy-Item "D:\Temp\anydesk.exe" "D:\Program Files\AnyDesk\AnyDesk.exe" -Force -ErrorAction SilentlyContinue

          Write-Host "✅ 下载 & 远程工具安装完成"

      - name: 8. System Tweaks & Initial Shortcuts (D Drive Only)
        run: |
          $desktop = "D:\Desktop"
          $shell = New-Object -ComObject WScript.Shell

          $shortcuts = @(
            @{ Name = "Chrome.lnk";         Path = "D:\Program Files\Google\Chrome\Application\chrome.exe" },
            @{ Name = "Firefox.lnk";        Path = "D:\Program Files\Mozilla Firefox\firefox.exe" },
            @{ Name = "VS Code.lnk";        Path = "D:\Program Files\Microsoft VS Code\Code.exe" },
            @{ Name = "Notepad++.lnk";      Path = "D:\Program Files\Notepad++\notepad++.exe" },
            @{ Name = "7-Zip.lnk";          Path = "D:\Program Files\7-Zip\7zFM.exe" },
            @{ Name = "Everything.lnk";     Path = "D:\Program Files\Everything\Everything.exe" },
            @{ Name = "VLC.lnk";            Path = "D:\Program Files\VLC\vlc.exe" },
            @{ Name = "qBittorrent.lnk";    Path = "D:\Program Files\qBittorrent\qbittorrent.exe" },
            @{ Name = "WinSCP.lnk";         Path = "D:\Program Files\WinSCP\WinSCP.exe" },
            @{ Name = "PowerShell 7.lnk";   Path = "D:\Program Files\PowerShell\7\pwsh.exe" },
            @{ Name = "PowerToys.lnk";      Path = "D:\Program Files\PowerToys\PowerToys.exe" }
          )

          $count = 0
          foreach ($s in $shortcuts) {
            if (Test-Path $s.Path) {
              $lnk = $shell.CreateShortcut("$desktop\$($s.Name)")
              $lnk.TargetPath = $s.Path
              $lnk.Save()
              Write-Host "  ✅ $($s.Name) [D 盘]"
              $count++
            } else {
              Write-Host "  ⚠️ 跳过 $($s.Name)（未安装）"
            }
          }
          Write-Host "✅ 快捷方式: $count 个 → D:\Desktop"

          Write-Host "⚙️ 系统优化..."
          Set-ItemProperty -Path "HKCU:\Control Panel\Desktop" -Name "ScreenSaveActive" -Value 0
          powercfg /hibernate off
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c6b3c
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced" -Name "HideFileExt" -Value 0
          Write-Host "✅ 系统优化完成"

      - name: 9. Install Software - Office & Productivity (D Drive)
        run: |
          $ProgressPreference = 'SilentlyContinue'

          Write-Host "📄 LibreOffice → D:\Program Files\LibreOffice"
          Invoke-WebRequest "https://download.documentfoundation.org/libreoffice/stable/25.2.5/win/x86_64/LibreOffice_25.2.5_Win_x86-64.msi" -OutFile "D:\Temp\libreoffice.msi"
          Start-Process msiexec -ArgumentList "/i D:\Temp\libreoffice.msi /quiet /norestart INSTALLLOCATION=D:\Program Files\LibreOffice" -Wait -ErrorAction SilentlyContinue

          Write-Host "📕 SumatraPDF → D:\Program Files\SumatraPDF"
          Invoke-WebRequest "https://www.sumatrapdfreader.org/dl/SumatraPDF-3.5.2-64.exe" -OutFile "D:\Temp\sumatra.exe"
          Start-Process "D:\Temp\sumatra.exe" -ArgumentList "/silent /D=D:\Program Files\SumatraPDF" -Wait -ErrorAction SilentlyContinue

          Write-Host "🎥 OBS Studio → D:\Program Files\obs-studio"
          Invoke-WebRequest "https://github.com/obsproject/obs-studio/releases/download/30.2.6/OBS-Studio-30.2.6-Windows-Installer.exe" -OutFile "D:\Temp\obs.exe"
          Start-Process "D:\Temp\obs.exe" -ArgumentList "/S /D=D:\Program Files\obs-studio" -Wait -ErrorAction SilentlyContinue

          Write-Host "📷 ShareX → D:\Program Files\ShareX"
          Invoke-WebRequest "https://getsharex.com/downloads/ShareX-16.0.4-setup.exe" -OutFile "D:\Temp\sharex.exe"
          Start-Process "D:\Temp\sharex.exe" -ArgumentList "/silent /D=D:\Program Files\ShareX" -Wait -ErrorAction SilentlyContinue

          Write-Host "🚀 Flow Launcher → D:\Program Files\Flow Launcher"
          Invoke-WebRequest "https://github.com/Flow-Launcher/Flow.Launcher/releases/download/v1.20.0/Flow-Launcher-Setup.exe" -OutFile "D:\Temp\flow.exe"
          Start-Process "D:\Temp\flow.exe" -ArgumentList "/silent /D=D:\Program Files\Flow Launcher" -Wait -ErrorAction SilentlyContinue

          Write-Host "✅ 办公 & 生产力软件安装完成"

      - name: 10. Install Software - Network & Security (D Drive)
        run: |
          $ProgressPreference = 'SilentlyContinue'

          Write-Host "🌐 Nmap → D:\Program Files\Nmap"
          Invoke-WebRequest "https://nmap.org/dist/nmap-7.95-setup.exe" -OutFile "D:\Temp\nmap.exe"
          Start-Process "D:\Temp\nmap.exe" -ArgumentList "/S /D=D:\Program Files\Nmap" -Wait -ErrorAction SilentlyContinue

          Write-Host "🦈 Wireshark → D:\Program Files\Wireshark"
          Invoke-WebRequest "https://2.na.dl.wireshark.org/win64/Wireshark-4.4.2.exe" -OutFile "D:\Temp\wireshark.exe"
          Start-Process "D:\Temp\wireshark.exe" -ArgumentList "/S /D=D:\Program Files\Wireshark" -Wait -ErrorAction SilentlyContinue

          Write-Host "🔒 OpenVPN → D:\Program Files\OpenVPN"
          Invoke-WebRequest "https://swupdate.openvpn.org/community/releases/OpenVPN-2.6.12-I001-amd64.msi" -OutFile "D:\Temp\openvpn.msi"
          Start-Process msiexec -ArgumentList "/i D:\Temp\openvpn.msi /quiet /norestart INSTALLDIR=D:\Program Files\OpenVPN" -Wait -ErrorAction SilentlyContinue

          Write-Host "⚡ Clash Verge → D:\Program Files\Clash Verge"
          Invoke-WebRequest "https://github.com/clash-verge-rev/clash-verge-rev/releases/download/v2.0.2/Clash.Verge_2.0.2_x64_en-US.msi" -OutFile "D:\Temp\clash.msi"
          Start-Process msiexec -ArgumentList "/i D:\Temp\clash.msi /quiet /norestart INSTALLDIR=D:\Program Files\Clash Verge" -Wait -ErrorAction SilentlyContinue

          Write-Host "📁 FileZilla → D:\Program Files\FileZilla"
          Invoke-WebRequest "https://download.filezilla-project.org/client/FileZilla_3.65.1_win64-setup.exe" -OutFile "D:\Temp\filezilla.exe"
          Start-Process "D:\Temp\filezilla.exe" -ArgumentList "/S /D=D:\Program Files\FileZilla" -Wait -ErrorAction SilentlyContinue

          Write-Host "✅ 网络工具安装完成"

      - name: 11. Install Software - Media Creation & Design (D Drive)
        run: |
          $ProgressPreference = 'SilentlyContinue'

          Write-Host "🎨 GIMP → D:\Program Files\GIMP 2"
          Invoke-WebRequest "https://download.gimp.org/mirror/pub/gimp/v2.10/windows/gimp-2.10.38-setup.exe" -OutFile "D:\Temp\gimp.exe"
          Start-Process "D:\Temp\gimp.exe" -ArgumentList "/S /D=D:\Program Files\GIMP 2" -Wait -ErrorAction SilentlyContinue

          Write-Host "🖌️ Krita → D:\Program Files\Krita"
          Invoke-WebRequest "https://download.kde.org/stable/krita/5.2.6/krita-5.2.6-x64-64.exe" -OutFile "D:\Temp\krita.exe"
          Start-Process "D:\Temp\krita.exe" -ArgumentList "/S /D=D:\Program Files\Krita" -Wait -ErrorAction SilentlyContinue

          Write-Host "🎬 FFmpeg → D:\Tools\ffmpeg"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "D:\Temp\ffmpeg.zip"
          Expand-Archive "D:\Temp\ffmpeg.zip" -DestinationPath "D:\Tools\ffmpeg" -Force
          $ffmpegBin = (Get-ChildItem "D:\Tools\ffmpeg" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1).DirectoryName
          if ($ffmpegBin) {
            $envPath = [Environment]::GetEnvironmentVariable("Path", "Machine")
            [Environment]::SetEnvironmentVariable("Path", "$envPath;$ffmpegBin", "Machine")
            $env:Path += ";$ffmpegBin"
            Write-Host "  FFmpeg PATH → $ffmpegBin"
          }

          Write-Host "📀 HandBrake → D:\Program Files\HandBrake"
          Invoke-WebRequest "https://github.com/HandBrake/HandBrake/releases/download/1.9.0/HandBrake-1.9.0-x86_64-Win_GUI.exe" -OutFile "D:\Temp\handbrake.exe"
          Start-Process "D:\Temp\handbrake.exe" -ArgumentList "/S /D=D:\Program Files\HandBrake" -Wait -ErrorAction SilentlyContinue

          Write-Host "🎵 Audacity → D:\Program Files\Audacity"
          Invoke-WebRequest "https://github.com/audacity/audacity/releases/download/Audacity-3.7.0/audacity-win-3.7.0-x64.exe" -OutFile "D:\Temp\audacity.exe"
          Start-Process "D:\Temp\audacity.exe" -ArgumentList "/silent /D=D:\Program Files\Audacity" -Wait -ErrorAction SilentlyContinue

          Write-Host "🎞️ ScreenToGif → D:\Program Files\ScreenToGif"
          Invoke-WebRequest "https://github.com/NickeManarin/ScreenToGif/releases/download/2.41/ScreenToGif.2.41.Setup.exe" -OutFile "D:\Temp\screentogif.exe"
          Start-Process "D:\Temp\screentogif.exe" -ArgumentList "/SILENT /D=D:\Program Files\ScreenToGif" -Wait -ErrorAction SilentlyContinue

          Write-Host "✅ 媒体创作软件安装完成"

      - name: 12. Install Software - Utilities & System (D Drive)
        run: |
          $ProgressPreference = 'SilentlyContinue'

          Write-Host "⚡ winget → D:\Program Files"
          $wingetApps = @("RARLab.WinRAR","Microsoft.DotNet.SDK.8","GoLang.Go","OpenJDK.JDK.21","Google.Drive","Zoom.Zoom","Spotify.Spotify","GitHub.cli","WinDirStat.WinDirStat","CPUID.CPU-Z","RealVNC.RealVNCViewer","RedHat.Podman")
          foreach ($app in $wingetApps) {
            Write-Host "  → $app"
            winget install $app --silent --accept-package-agreements --accept-source-agreements --disable-interactivity --location "D:\Program Files" 2>&1 | Out-Null
          }

          Write-Host "🐳 Podman 初始化..."
          podman machine init 2>&1 | Out-Null
          podman machine start 2>&1 | Out-Null
          if (podman version 2>&1) { Write-Host "  ✅ Podman 已就绪" } else { Write-Host "  ⚠️ Podman 初始化失败" }

          Write-Host "✅ 系统工具安装完成"

      - name: 13. Update Desktop Shortcuts (D Drive Only)
        run: |
          $desktop = "D:\Desktop"
          $shell = New-Object -ComObject WScript.Shell

          # Telegram（D 盘唯一路径）
          $tgPath = "D:\Program Files\Telegram Desktop\Telegram.exe"
          if (Test-Path $tgPath) {
            $lnk = $shell.CreateShortcut("$desktop\Telegram.lnk")
            $lnk.TargetPath = $tgPath
            $lnk.Save()
            Write-Host "  ✅ Telegram"
          }

          # 所有快捷方式（纯 D 盘，无 C 盘回退）
          $shortcuts = @(
            @{ Name = "LibreOffice.lnk";     Path = "D:\Program Files\LibreOffice\program\soffice.exe" },
            @{ Name = "SumatraPDF.lnk";      Path = "D:\Program Files\SumatraPDF\SumatraPDF.exe" },
            @{ Name = "OBS Studio.lnk";      Path = "D:\Program Files\obs-studio\bin\64bit\obs64.exe" },
            @{ Name = "ShareX.lnk";          Path = "D:\Program Files\ShareX\ShareX.exe" },
            @{ Name = "GIMP.lnk";             Path = "D:\Program Files\GIMP 2\bin\gimp-2.10.exe" },
            @{ Name = "Krita.lnk";           Path = "D:\Program Files\Krita\bin\krita.exe" },
            @{ Name = "HandBrake.lnk";       Path = "D:\Program Files\HandBrake\HandBrake.exe" },
            @{ Name = "Audacity.lnk";        Path = "D:\Program Files\Audacity\audacity.exe" },
            @{ Name = "ScreenToGif.lnk";     Path = "D:\Program Files\ScreenToGif\ScreenToGif.exe" },
            @{ Name = "Nmap.lnk";            Path = "D:\Program Files\Nmap\zenmap.exe" },
            @{ Name = "Wireshark.lnk";       Path = "D:\Program Files\Wireshark\Wireshark.exe" },
            @{ Name = "FileZilla.lnk";       Path = "D:\Program Files\FileZilla\filezilla.exe" },
            @{ Name = "Clash Verge.lnk";     Path = "D:\Program Files\Clash Verge\Clash Verge.exe" },
            @{ Name = "OpenVPN.lnk";         Path = "D:\Program Files\OpenVPN\bin\openvpn-gui.exe" },
            @{ Name = "WinRAR.lnk";          Path = "D:\Program Files\WinRAR\WinRAR.exe" },
            @{ Name = "Flow Launcher.lnk";   Path = "D:\Program Files\Flow Launcher\Flow.Launcher.exe" },
            @{ Name = "Spotify.lnk";         Path = "D:\Program Files\Spotify\Spotify.exe" },
            @{ Name = "CPU-Z.lnk";           Path = "D:\Program Files\CPU-Z\cpuz_x64.exe" },
            @{ Name = "WinDirStat.lnk";      Path = "D:\Program Files\WinDirStat\windirstat.exe" },
            @{ Name = "AnyDesk.lnk";         Path = "D:\Program Files\AnyDesk\AnyDesk.exe" },
            @{ Name = "IDM.lnk";             Path = "D:\Program Files\IDM\IDMan.exe" },
            @{ Name = "PotPlayer.lnk";      Path = "D:\Program Files\PotPlayer\PotPlayerMini64.exe" },
            @{ Name = "Podman.lnk";          Path = "D:\Program Files\RedHat\Podman\podman.exe" }
          )

          $count = 0; $skip = 0
          foreach ($s in $shortcuts) {
            if (Test-Path $s.Path) {
              $lnk = $shell.CreateShortcut("$desktop\$($s.Name)")
              $lnk.TargetPath = $s.Path
              $lnk.Save()
              Write-Host "  ✅ $($s.Name)"
              $count++
            } else {
              Write-Host "  ⚠️ 跳过 $($s.Name)"
              $skip++
            }
          }
          Write-Host "✅ 快捷方式 → D:\Desktop | 已创建: $count | 跳过: $skip"

      - name: 14. Cleanup & Summary (D Drive)
        run: |
          Write-Host "🧹 清理 D:\Temp..."
          $files = @("D:\Temp\chrome.exe","D:\Temp\firefox.exe","D:\Temp\7z.exe","D:\Temp\npp.exe","D:\Temp\everything.exe",
                      "D:\Temp\vlc.exe","D:\Temp\qbittorrent.exe","D:\Temp\telegram.exe","D:\Temp\potplayer.exe",
                      "D:\Temp\idm.exe","D:\Temp\winscp.exe","D:\Temp\anydesk.exe",
                      "D:\Temp\tailscale.msi","D:\Temp\pwsh7.msi","D:\Temp\ngrok.zip",
                      "D:\Temp\libreoffice.msi","D:\Temp\sumatra.exe","D:\Temp\obs.exe","D:\Temp\sharex.exe","D:\Temp\flow.exe",
                      "D:\Temp\nmap.exe","D:\Temp\wireshark.exe","D:\Temp\openvpn.msi","D:\Temp\clash.msi","D:\Temp\filezilla.exe",
                      "D:\Temp\gimp.exe","D:\Temp\krita.exe","D:\Temp\ffmpeg.zip","D:\Temp\handbrake.exe","D:\Temp\audacity.exe","D:\Temp\screentogif.exe")
          $cleaned = 0
          foreach ($f in $files) {
            if (Test-Path $f) { Remove-Item $f -Force -ErrorAction SilentlyContinue; $cleaned++ }
          }

          # D 盘统计
          $dApps = (Get-ChildItem "D:\Program Files" -Directory -ErrorAction SilentlyContinue).Count
          $dSize = [math]::Round((Get-ChildItem "D:\Program Files" -Recurse -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum / 1MB, 0)
          $dTools = (Get-ChildItem "D:\Tools" -Directory -ErrorAction SilentlyContinue).Count
          $dShortcuts = (Get-ChildItem "D:\Desktop" -Filter "*.lnk" -ErrorAction SilentlyContinue).Count

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "  📋 安装总结 — 全部 D 盘" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "  安装目录:   D:\Program Files ($dApps 个, ${dSize} MB)" -ForegroundColor Green
          Write-Host "  工具目录:   D:\Tools ($dTools 个)" -ForegroundColor Green
          Write-Host "  桌面目录:   D:\Desktop ($dShortcuts 个快捷方式)" -ForegroundColor Green
          Write-Host "  临时目录:   D:\Temp" -ForegroundColor Green
          Write-Host "  文档目录:   D:\Documents" -ForegroundColor Green
          Write-Host "  下载目录:   D:\Downloads" -ForegroundColor Green
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "  浏览器:     Chrome, Firefox" -ForegroundColor White
          Write-Host "  工具:       7-Zip, Notepad++, Everything, WinRAR, Flow Launcher" -ForegroundColor White
          Write-Host "  开发:       Git, VS Code, Python, Node.js, PowerShell 7, .NET 8, Go, JDK 21" -ForegroundColor White
          Write-Host "  媒体:       VLC, PotPlayer, qBittorrent, Telegram, Spotify" -ForegroundColor White
          Write-Host "  下载/远程:  IDM, WinSCP, AnyDesk, RealVNC" -ForegroundColor White
          Write-Host "  办公:       LibreOffice, SumatraPDF, OBS, ShareX" -ForegroundColor White
          Write-Host "  网络:       Nmap, Wireshark, OpenVPN, Clash Verge, FileZilla" -ForegroundColor White
          Write-Host "  创作:       GIMP, Krita, FFmpeg, HandBrake, Audacity, ScreenToGif" -ForegroundColor White
          Write-Host "  系统:       PowerToys, CPU-Z, WinDirStat, Google Drive, Zoom" -ForegroundColor White
          Write-Host "  容器:       Podman" -ForegroundColor White
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "  清理临时文件: $cleaned 个" -ForegroundColor Green
          Write-Host "  VPN 模式: ${{ github.event.inputs.vpn_mode }}" -ForegroundColor Yellow
          Write-Host "  保活时长: ${{ github.event.inputs.keep_alive_hours }} 小时" -ForegroundColor Yellow
          Write-Host "==========================================" -ForegroundColor Cyan

      - name: 15. Keep Server Alive
        run: |
          $hours = [double]"${{ github.event.inputs.keep_alive_hours }}"
          $totalMinutes = [int]($hours * 60) - 10
          $endTime = (Get-Date).AddMinutes($totalMinutes)

          Write-Host "⏰ 保活 $hours 小时，预计结束: $endTime (UTC)"

          $i = 0
          while ((Get-Date) -lt $endTime) {
              Start-Sleep -Seconds 60
              $i++
              $remaining = [int](($endTime - (Get-Date)).TotalMinutes)
              Write-Host "[$i] 运行中... 剩余约 $remaining 分钟"
          }

          Write-Host "⏰ 保活结束"
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "  ⚠️ RDP 会话即将断开 — 请保存工作！" -ForegroundColor Red
          Write-Host "==========================================" -ForegroundColor Green