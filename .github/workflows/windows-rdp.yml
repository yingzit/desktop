name: Windows Cloud RDP

on:
  workflow_dispatch:
    inputs:
      proxy_mode:
        description: "代理模式（off=仅RDP / exit-node=出口代理）"
        required: false
        default: "off"
        type: choice
        options:
          - off
          - exit-node

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 330

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "NvdAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NvdAdmin" -ErrorAction SilentlyContinue
          net user runneradmin P@ssw0rd1qazXSW@#

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $proxyMode = "${{ github.event.inputs.proxy_mode }}"

          # 开启 IP 转发（代理模式需要）
          if ($proxyMode -eq "exit-node") {
            Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters" -Name "IPEnableRouter" -Value 1
            try { Start-Service -Name "RemoteAccess" -ErrorAction Stop } catch {}
          }

          # Download and install Tailscale silently
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait

          # Connect to Tailscale network
          Start-Sleep -Seconds 5
          $tsArgs = @("up", "--authkey=$Env:TAILSCALE_AUTHKEY", "--hostname=github-rdp")
          if ($proxyMode -eq "exit-node") {
            $tsArgs += "--advertise-exit-node"
            $tsArgs += "--accept-routes"
          }
          & "C:\Program Files\Tailscale\tailscale.exe" @tsArgs 2>&1

          Start-Sleep -Seconds 8

          # Get Tailscale IP
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : NvdAdmin" -ForegroundColor Yellow
          Write-Host "  Password     : P@ssw0rd1qazXSW@#" -ForegroundColor Yellow
          Write-Host "  Proxy Mode   : $proxyMode" -ForegroundColor Yellow
          if ($proxyMode -eq "exit-node") {
            Write-Host "  >> Approve: https://login.tailscale.com/admin/machines" -ForegroundColor Magenta
            Write-Host "  >> Use:     tailscale set --exit-node=github-rdp" -ForegroundColor Magenta
          }
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host "==========================================" -ForegroundColor Green

      - name: 4. Cleanup
        run: |
          Remove-Item "C:\tailscale.msi" -Force -ErrorAction SilentlyContinue
          Write-Host "✅ 临时文件已清理"

      - name: 5. Keep Server Alive (5.5 Hours)
        run: |
          $totalMinutes = 330
          $endTime = (Get-Date).AddMinutes($totalMinutes)

          Write-Host "⏰ 保活 5.5 小时，结束时间: $endTime (UTC)"

          $i = 0
          while ((Get-Date) -lt $endTime) {
              Start-Sleep -Seconds 60
              $i++
              $remaining = [int](($endTime - (Get-Date)).TotalMinutes)
              Write-Host "[$i] Server running... 剩余约 $remaining 分钟"
          }

          Write-Host "⏰ 保活结束，runner 即将退出。"
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "  ⚠️ RDP 会话即将断开 — 请保存工作！" -ForegroundColor Red
          Write-Host "==========================================" -ForegroundColor Green